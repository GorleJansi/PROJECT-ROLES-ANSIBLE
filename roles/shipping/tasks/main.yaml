- name: app setup
  import_role:
     name: common
     tasks_from: app-setup.yaml

- name: java setup
  import_role:
     name: common
     tasks_from: java.yaml    

- name: system-setup
  import_role:
    name: common
    tasks_from: system-setup.yaml


- name: install mysql python libraries
  ansible.builtin.pip:
    executable: pip3.9
    name: "{{ item }}"
  loop:
  - cryptography
  - PyMySQL

- name: import shipping data into mysql
    community.mysql.mysql_db:
      state: import
      name: all
      login_host: mysql.daws86s.fun
      login_user: root
      login_password: RoboShop@1
      target: "{{ item }}"
    loop:
    - /app/db/schema.sql
    - /app/db/app-user.sql 
    - /app/db/master-data.sql    