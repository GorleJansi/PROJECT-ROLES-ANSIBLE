
- name: delete existing home directory
  file:
    state: absent
    path: /app

- name: create home directory
  file:
    state: directory
    path: /app

- name: create system user
  user:
    system: true
    home: /app
    shell: /sbin/nologin
    name: roboshop

- name: delete existing code in /tmp folder
  file:
    state: absent
    path: /tmp/{{ component }}.zip

- name: download app code 
  get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip 
    dest: /tmp/{{ component }}.zip
    remote_src: true

- name: insatll dependencies
  command: npm install
  args:
    chdir: /app

- name: copy service file
  template:
      src: {{ component }}.service.j2
      dest: /etc/systemd/system/{{ component }}.service
  notify: daemon reload
